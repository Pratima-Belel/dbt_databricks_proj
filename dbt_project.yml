name: 'shopflow_analytics'
version: '1.0.0'
config-version: 2

# This setting configures which "profile" dbt uses for this project.
profile: 'shopflow_analytics'

# These configurations specify where dbt should look for different types of files.
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: 'target'
clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"


on-run-start:
  - "{{ log('🚀 Starting shopflow_analytics run', info=True) }}"
  - "CREATE SCHEMA IF NOT EXISTS bronze"
  - "CREATE SCHEMA IF NOT EXISTS silver"
  - "CREATE SCHEMA IF NOT EXISTS gold"
on-run-end:
  - "{{ log('✅ Finished shopflow_analytics run', info=True) }}"

vars:
  project_schema: 'shopflow'


models:
  shopflow_analytics:
    staging:
      +materialized: view
      +schema: silver
    intermediate:
      +materialized: view
      +schema: silver
    marts:
      +materialized: table
      +schema: gold
      core:
        +materialized: table
        +schema: gold

snapshots:
  shopflow_analytics:
    +schema: gold

#Type-cast the column values of CSV , else dbt infers it as string
seeds:
  shopflow_analytics:
    +schema: bronze
    raw_customers:
      +column_types:
        customer_id: string
        first_name: string
        last_name: string
        email: string
        country: string
        created_at: timestamp
    raw_orders:
      +column_types:
        order_id: string
        customer_id: string
        order_date: date
        status: string
        total_amount: double
    raw_order_items:
      +column_types:
        order_item_id: string
        order_id: string
        product_id: string
        quantity: int
        unit_price: double
    raw_products:
      +column_types:
        product_id: string
        product_name: string
        category: string
        price: double
